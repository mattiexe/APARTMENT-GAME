<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Way Down</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div id="floor-badge"><span id="floor-num">10</span><small>F</small></div>
      <div id="floor-theme"></div>
      <nav>
        <button id="phone-btn">Phone <span id="phone-badge" hidden>0</span></button>
        <button id="rules-btn">Rules</button>
        <button id="cast-btn">Dossier</button>
        <button id="menu-btn" title="Restart">⟲</button>
      </nav>
    </header>

    <main id="stage">
      <div id="portraits"></div>
      <div id="dialogue">
        <div id="speaker"></div>
        <div id="text"></div>
      </div>
    </main>

    <div id="choices"></div>
    <div id="inventory"></div>
  </div>

  <div id="panel" hidden>
    <div id="panel-box">
      <div id="panel-head"><h2 id="panel-title"></h2><button id="panel-close">✕</button></div>
      <div id="panel-body"></div>
    </div>
  </div>

  <!-- Engine first, then characters, then each floor. Add new floors here. -->
  <script src="js/engine.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/floors/floor10.js"></script>
  <script src="js/floors/floor9.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
